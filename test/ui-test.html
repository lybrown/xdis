<!doctype html>
<!-- Drives the real UI in an iframe. Serve the repo over http and open
     test/ui-test.html, or run headless:
       chrome --headless=new --dump-dom --virtual-time-budget=30000 http://localhost:8765/test/ui-test.html -->
<meta charset="utf-8">
<title>xdis UI test</title>
<style>body{font:13px monospace} .fail{color:#c00} .pass{color:#080}</style>
<pre id="log"></pre>
<iframe id="app" width="1400" height="900"></iframe>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const BIN = params.get('bin') || 'test/out/ransack.xex';
const log = (cls, msg) => {
    const el = document.getElementById('log');
    el.innerHTML += `<span class="${cls}">${cls.toUpperCase()}</span> ${msg.replace(/</g, '&lt;')}\n`;
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let failures = 0;
function check(name, ok, detail) {
    if (!ok) failures++;
    log(ok ? 'pass' : 'fail', name + (detail ? ' — ' + detail : ''));
}

(async () => {
    const frame = document.getElementById('app');
    frame.src = '../index.html?bin=' + BIN + '&dop=symbols/hardware.dop';
    await new Promise((r) => frame.onload = r);
    const w = frame.contentWindow;
    const doc = w.document;
    for (let i = 0; i < 100 && !(w.xdis && w.xdis.listing); i++) await sleep(50);
    const S = w.xdis, X = w.XDis;
    check('loaded', !!S.listing, S.listing && `${S.listing.lines.length} lines`);
    const key = (k, extra) => w.dispatchEvent(new w.KeyboardEvent('keydown', Object.assign({ key: k, bubbles: true }, extra)));
    const asm = () => X.asmText(S.listing, S.project.options);
    const lineAt = (s, a, kind) => S.listing.lines.findIndex((l) => l.s === s && l.a === a && (!kind || l.k === kind));
    // Fill in the open prompt and press Enter; wait for the edit to land.
    async function answer(text) {
        for (let i = 0; i < 100 && !(doc.getElementById('dlg').open && doc.getElementById('dlg-input')); i++) await sleep(10);
        const inp = doc.getElementById('dlg-input');
        if (!inp || !doc.getElementById('dlg').open) { log('fail', `no dialog for "${text}"`); failures++; return false; }
        const before = [S.listing, S.cur, doc.getElementById('status-msg').textContent].join();
        inp.value = text;
        inp.dispatchEvent(new w.Event('input'));
        inp.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
        for (let i = 0; i < 100 && [S.listing, S.cur, doc.getElementById('status-msg').textContent].join() === before; i++) await sleep(10);
        return !doc.getElementById('dlg').open;
    }
    function cursorTo(i) {
        S.cur = S.anchor = i;
    }

    // 1. rename an auto label from the keyboard; every reference updates
    const target = S.listing.lines.find((l) => l.k === 'label' && /^s?\d*l[0-9A-F]{4}$/.test(l.p[0][1]) && l.x);
    const oldName = target.p[0][1];
    const refsBefore = asm().split(oldName).length - 1;
    cursorTo(S.listing.lines.indexOf(target));
    key('n');
    check('rename dialog opens', doc.getElementById('dlg').open);
    check('rename applied', await answer('my_routine'));
    const text1 = asm();
    check('label renamed everywhere', !text1.includes(oldName + '\t') && !new RegExp('\\b' + oldName + '\\b').test(text1) &&
        text1.split('my_routine').length - 1 === refsBefore, `${refsBefore} refs`);

    // 2. mark an instruction as data, then undo
    const ins = S.listing.lines.findIndex((l) => l.k === 'ins' && l.n === 3);
    const insLn = S.listing.lines[ins];
    cursorTo(ins);
    key('d');
    let now = S.listing.lines[lineAt(insLn.s, insLn.a, 'data')];
    check('D turns instruction into data', !!now && lineAt(insLn.s, insLn.a, 'ins') < 0);
    check('data directive recorded', S.project.directives.some((d) => d.type === 'data' && d.addr === insLn.a && d.range === 2));
    key('z', { ctrlKey: true });
    check('undo restores instruction', lineAt(insLn.s, insLn.a, 'ins') >= 0 && !S.project.directives.some((d) => d.type === 'data' && d.addr === insLn.a));
    key('y', { ctrlKey: true });
    check('redo re-applies data', lineAt(insLn.s, insLn.a, 'data') >= 0);
    key('z', { ctrlKey: true });

    // 3. mark untraced data as code
    const dataLn = S.listing.lines.find((l, i) => l.k === 'data' && l.n >= 4 &&
        X.OPS[S.model.S[l.s - 1].seg.data[l.a - S.model.S[l.s - 1].seg.start]].mn === 'lda');
    if (dataLn) {
        cursorTo(S.listing.lines.indexOf(dataLn));
        key('c');
        check('C traces new code', lineAt(dataLn.s, dataLn.a, 'ins') >= 0, '$' + X.h4(dataLn.a));
        check('C entry label created', S.listing.lines.some((l) => l.k === 'label' && l.a === dataLn.a));
    } else {
        log('skip', 'no untraced lda found');
    }

    // 4. comments
    cursorTo(lineAt(insLn.s, insLn.a, 'ins'));
    key(';');
    await answer('hello comment');
    check('comment shows in listing', S.listing.lines[lineAt(insLn.s, insLn.a, 'ins')].u === 'hello comment');
    check('comment in asm', asm().includes('; hello comment') || asm().includes(' hello comment'));

    // 5. goto by label
    key('g');
    await answer('my_routine');
    check('goto label', S.listing.lines[S.cur].a === target.a, `cursor ${X.h4(S.listing.lines[S.cur].a)}`);

    // 6. follow operand and go back
    const jsr = S.listing.lines.findIndex((l) => l.k === 'ins' && l.p.some((p) => p[0] === 'sym' && p[2] !== undefined) && l.p[1][1] === 'jsr');
    if (jsr >= 0) {
        cursorTo(jsr);
        key('Enter');
        const landed = S.listing.lines[S.cur];
        check('Enter follows jsr', landed.a === (S.listing.lines[jsr].p.find((p) => p[2] !== undefined)[2] & 0xFFFF));
        key('Escape');
        check('Esc goes back', S.cur === jsr);
    }

    // 7. constant naming on an immediate
    const imm = S.listing.lines.findIndex((l) => l.k === 'ins' && l.p.some((p) => p[1] === '#'));
    cursorTo(imm);
    key('k');
    const immLn = S.listing.lines[imm];
    await answer('MYCONST');
    const after = S.listing.lines[lineAt(immLn.s, immLn.a, 'ins')];
    check('constant used in operand', after.p.some((p) => p[1] === 'MYCONST'), after.p.map((p) => p[1]).join(''));
    check('constant equ emitted', /^MYCONST equ \$/m.test(asm()));

    // 8. pointer table over two data bytes
    const d2 = S.listing.lines.findIndex((l) => l.k === 'data' && l.n >= 2 && l.p[1] && l.p[1][1] === 'dta ');
    if (d2 >= 0) {
        const L2 = S.listing.lines[d2];
        cursorTo(d2);
        key('a');
        const pl = S.listing.lines[lineAt(L2.s, L2.a, 'data')];
        check('A makes pointer', pl && pl.p.some((p) => p[1] === 'a('), pl && pl.p.map((p) => p[1]).join(''));
    }

    // 9. output still exports and the .dop round trips through the parser
    const dop = X.exportDop(S.project, S.model);
    const back = X.dedupeImported(X.parseDop(dop).directives).map(X.directiveString);
    check('dop round trip', JSON.stringify(back) === JSON.stringify(S.project.directives.map(X.directiveString)),
        `${back.length} vs ${S.project.directives.length}`);
    const proj = X.serializeProject(S.project, S.bytes, true);
    const re = X.deserializeProject(proj);
    check('project round trip', re.bytes.length === S.bytes.length &&
        JSON.stringify(re.project.directives) === JSON.stringify(S.project.directives.map((d) => X.parseDirectiveLine(X.directiveString(d)))));

    // 9b. click a byte in the middle of a dta line and name it
    const dl = S.listing.lines.findIndex((l) => l.k === 'data' && l.n >= 6 && l.p.filter((p) => p[3] !== undefined).length === l.n);
    if (dl >= 0) {
        const DL = S.listing.lines[dl];
        const mid = DL.a + 3;
        S.cur = S.anchor = dl;
        doc.getElementById('listing').scrollTop = dl * 18;
        w.xdis.sub = null;
        doc.getElementById('listing').dispatchEvent(new w.Event('scroll'));
        await sleep(50);
        const span = doc.querySelector(`.row[data-i="${dl}"] .src [data-a="${mid}"]`);
        check('dta bytes are clickable', !!span);
        span.dispatchEvent(new w.MouseEvent('mouseover', { bubbles: true }));
        const tip = doc.getElementById('tip'), v = S.model.segOf(X.key(DL.s, mid)).seg.data[mid - S.model.segOf(X.key(DL.s, mid)).seg.start];
        check('hovering a byte shows its values', !tip.hidden && tip.textContent.includes('$' + X.h2(v) + '  ' + v) &&
            tip.textContent.includes('opcode: ' + X.OPS[v].mn), tip.textContent);
        span.dispatchEvent(new w.MouseEvent('mouseout', { bubbles: true }));
        check('leaving the byte hides the tip', tip.hidden);
        span.dispatchEvent(new w.MouseEvent('mousedown', { bubbles: true, button: 0 }));
        check('click picks the byte', S.sub === mid && doc.querySelector(`.row[data-i="${dl}"] .bsel`) !== null);
        await sleep(60);
        check('inspector shows picked byte', doc.querySelector('#tab-inspect .big').textContent.endsWith(X.h4(mid)));
        key('ArrowRight');
        check('Right steps to next byte', S.sub === mid + 1);
        key('ArrowLeft');
        check('Left steps back', S.sub === mid);
        key('n');
        await answer('mid_label');
        const li = S.listing.lines.findIndex((l) => l.k === 'label' && l.a === mid && l.p[0][1] === 'mid_label');
        check('label defined mid-line', li >= 0);
        check('dta line split at the label', S.listing.lines[li + 1].k === 'data' && S.listing.lines[li + 1].a === mid &&
            S.listing.lines[lineAt(DL.s, DL.a, 'data')].n === 3);
        check('cursor stays on the named byte', S.listing.lines[S.cur].a === mid);
    } else {
        log('skip', 'no plain dta line found');
    }

    // 9c. edit an existing directive in place
    doc.querySelector('[data-tab=directives]').click();
    const di = S.project.directives.findIndex((d) => d.name === 'my_routine');
    const editBtn = doc.querySelector(`#dir-list [data-edit="${di}"]`);
    check('directive has edit button', !!editBtn);
    editBtn.click();
    const ed = doc.querySelector('#dir-list .dir-edit');
    check('edit field opens with directive text', ed && /my_routine=(\d+:)?\$/.test(ed.value), ed && ed.value);
    ed.value = ed.value.replace('my_routine', 'renamed_routine');
    ed.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    await sleep(20);
    check('edited directive applies', /\brenamed_routine\b/.test(asm()) && !/\bmy_routine\b/.test(asm()));
    check('edit keeps directive count', S.project.directives.filter((d) => d.name === 'renamed_routine').length === 1);
    const bad = doc.querySelector(`#dir-list [data-edit="${di}"]`);
    bad.click();
    const ed2 = doc.querySelector('#dir-list .dir-edit');
    ed2.value = 'bogus stuff';
    ed2.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    check('invalid edit is rejected and stays open', !!doc.querySelector('#dir-list .dir-edit') &&
        doc.getElementById('status-msg').classList.contains('err'));
    ed2.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    check('Escape cancels edit', !doc.querySelector('#dir-list .dir-edit'));
    doc.querySelector('[data-tab=inspect]').click();

    // 9d. memory map is repainted from the current analysis after edits
    check('map base matches listing', S.mapBaseFor === S.listing);
    const map = doc.getElementById('map');
    const mr = map.getBoundingClientRect();
    map.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true, button: 0, pointerId: 1, clientX: mr.left + 5, clientY: mr.top + 5 }));
    map.dispatchEvent(new w.PointerEvent('pointermove', { bubbles: true, pointerId: 1, buttons: 1, clientX: mr.right + 300, clientY: mr.bottom + 200 }));
    const lastSeg = S.model.S[S.model.S.length - 1].seg;
    const atEnd = S.listing.lines[S.cur];
    check('map drag past the edge clamps to the end', atEnd.s === lastSeg.index, `seg ${atEnd.s} addr ${X.h4(atEnd.a)}`);
    map.dispatchEvent(new w.PointerEvent('pointermove', { bubbles: true, pointerId: 1, buttons: 1, clientX: mr.left - 300, clientY: mr.top - 50 }));
    check('map drag past the start clamps to the start', S.listing.lines[S.cur].s === S.model.S[0].seg.index);
    map.dispatchEvent(new w.PointerEvent('pointerup', { bubbles: true, pointerId: 1, clientX: mr.left - 300, clientY: mr.top }));

    // 9e. Callers / Access comments link to the referencing instruction
    for (const kind of ['label', 'data']) {
        const xi = S.listing.lines.findIndex((l) => l.k === kind && l.x && S.model.refs.get(X.key(l.s, l.a)) &&
            S.model.refs.get(X.key(l.s, l.a))[kind === 'label' ? 'callers' : 'access'].some((r) => typeof r === 'number'));
        if (xi < 0) { log('skip', 'no ' + kind + ' xref'); continue; }
        S.cur = S.anchor = xi;
        doc.getElementById('listing').scrollTop = Math.max(0, xi * 18 - 100);
        doc.getElementById('listing').dispatchEvent(new w.Event('scroll'));
        for (let t = 0; t < 100 && !doc.querySelector(`.row[data-i="${xi}"]`); t++) await sleep(10);
        const link = doc.querySelector(`.row[data-i="${xi}"] .cm [data-xk]`);
        check(`${kind} xref is a link`, !!link, S.listing.lines[xi].x);
        if (!link) continue;
        const want = +link.dataset.xk;
        link.dispatchEvent(new w.MouseEvent('mousedown', { bubbles: true, button: 0 }));
        const got = S.listing.lines[S.cur];
        check(`clicking ${link.textContent} jumps there`, got.a === X.keyAddr(want) && got.s === X.keySeg(want),
            `${X.h4(got.a)} vs ${X.h4(X.keyAddr(want))}`);
        key('Escape');
        check('Esc returns from xref jump', S.cur === xi);
    }

    // 9f. clicking a problem goes to where it applies
    const addDir = async (text) => {
        const inp = doc.getElementById('dir-add');
        inp.value = text;
        inp.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
        await sleep(20);
    };
    const firstCode = S.listing.lines.filter((l) => l.k === 'ins');
    const [c1, c2] = [firstCode[3], firstCode[40]];
    await addDir(`label dupname=${S.img.multi && S.model.cover[c1.a] > 1 ? c1.s + ':' : ''}$${X.h4(c1.a)}`);
    await addDir(`label dupname=${S.img.multi && S.model.cover[c2.a] > 1 ? c2.s + ':' : ''}$${X.h4(c2.a)}`);
    await addDir('code 99:$2000');
    doc.querySelector('[data-tab=problems]').click();
    const probs = Array.from(doc.querySelectorAll('#problem-list .problem'));
    const dupP = probs.find((p) => /dupname is defined at both/.test(p.textContent));
    const segP = probs.find((p) => /no segment 99/.test(p.textContent));
    check('duplicate label problem is clickable', dupP && dupP.classList.contains('link'), dupP && dupP.textContent);
    dupP.click();
    check('problem click jumps to the address', S.listing.lines[S.cur].a === c2.a, X.h4(S.listing.lines[S.cur].a));
    check('bad directive problem is clickable', segP && segP.classList.contains('link'));
    segP.click();
    check('directive problem shows the directive', !doc.getElementById('tab-directives').hidden &&
        doc.getElementById('dir-filter').value === 'code 99:$2000' && doc.querySelectorAll('#dir-list .item').length === 1);
    for (let n = 0; n < 3; n++) key('z', { ctrlKey: true });
    doc.getElementById('dir-filter').value = '';
    doc.querySelector('[data-tab=inspect]').click();
    check('undo removes the test directives', !S.project.directives.some((d) => d.name === 'dupname' || d.seg === 99));

    // 9g. directives not needed for tracing are marked
    const traced = S.listing.lines.filter((l) => l.k === 'ins')[60];
    const loc = (S.img.multi && S.model.cover[traced.a] > 1 ? traced.s + ':' : '') + '$' + X.h4(traced.a);
    await addDir('code ' + loc);
    const extra = S.project.directives[S.project.directives.length - 1];
    for (let t = 0; t < 300 && !(S.scan && S.scan.done() >= S.scan.total); t++) await sleep(10);
    check('scan finishes', S.scan.done() === S.scan.total, `${S.scan.done()}/${S.scan.total}`);
    check('redundant code entry marked "no effect"', S.dirState.get(extra) === 'none');
    const needed = S.project.directives.find((d) => d.type === 'code' && d.addr === 0x20FF);
    check('needed code entry not marked', !needed || S.dirState.get(needed) === 'needed');
    doc.querySelector('[data-tab=directives]').click();
    doc.getElementById('dir-unneeded').click();
    const shown = Array.from(doc.querySelectorAll('#dir-list .item .nm')).map((n) => n.textContent);
    check('filter shows only unneeded', shown.includes(X.directiveString(extra)) && shown.every((t) => {
        const d = S.project.directives.find((x) => X.directiveString(x) === t);
        return d && S.dirState.get(d) !== 'needed';
    }), shown.length + ' shown');
    check('tag rendered', !!doc.querySelector('#dir-list .tag-none'));
    check('count mentions unneeded', /not needed for tracing/.test(doc.getElementById('dir-count').textContent));
    doc.getElementById('dir-unneeded').click();
    doc.querySelector('[data-tab=inspect]').click();
    key('z', { ctrlKey: true });

    // 9h. repeated patterns are opt-in from the Project panel
    doc.querySelector('[data-tab=project]').click();
    const pm = doc.querySelector('[data-num=patternMax]');
    check('pattern option present and off', pm && pm.value === '0');
    pm.value = '16';
    pm.dispatchEvent(new w.Event('change', { bubbles: true }));
    check('pattern option applied', S.project.options.patternMax === 16);
    key('z', { ctrlKey: true });
    check('pattern option undoable', !S.project.options.patternMax);
    doc.querySelector('[data-tab=inspect]').click();

    // 10. context menu offers the actions
    const row = doc.querySelector('.row.cur');
    row.dispatchEvent(new w.MouseEvent('contextmenu', { bubbles: true, clientX: 300, clientY: 200 }));
    const ctx = doc.getElementById('ctx');
    check('context menu opens', !ctx.hidden && ctx.querySelectorAll('.mi').length >= 10, ctx.querySelectorAll('.mi').length + ' items');
    ctx.hidden = true;

    // 10a. find in the source
    key('f', { ctrlKey: true });
    const fbar = doc.getElementById('findbar'), fin = doc.getElementById('find-input');
    check('Ctrl+F opens the find bar', !fbar.hidden && doc.activeElement === fin);
    fin.value = 'portb';
    fin.dispatchEvent(new w.Event('input'));
    await sleep(200);
    const lineSrc = () => w.XDis.lineText(S.listing.lines[S.cur], S.project.options);
    check('typing jumps to the first match', /PORTB/.test(lineSrc()), lineSrc());
    const count = doc.getElementById('find-count').textContent;
    check('match count shown', /^\d+ of \d+$/.test(count), count);
    const first = S.cur;
    fin.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    check('Enter goes to the next match', S.cur > first && /PORTB/.test(lineSrc()));
    fin.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', shiftKey: true, bubbles: true }));
    check('Shift+Enter goes back', S.cur === first);
    check('matching rows highlighted', doc.querySelectorAll('.row.hit').length > 0);
    doc.getElementById('find-case').click();
    check('match case finds nothing for portb', doc.getElementById('find-count').textContent === 'no matches');
    doc.getElementById('find-case').click();
    doc.getElementById('find-regex').click();
    fin.value = 'sta\\s+PORT[AB]';
    fin.dispatchEvent(new w.Event('input'));
    await sleep(200);
    check('regex search', /sta\s+PORT[AB]/.test(lineSrc()), lineSrc());
    doc.getElementById('find-regex').click();
    fin.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    check('Esc closes the find bar', fbar.hidden && !doc.querySelector('.row.hit'));

    // 10b. Save binary downloads the original bytes under the original name
    const saveBin = doc.getElementById('btn-save-bin');
    check('save binary enabled', !!saveBin && !saveBin.disabled);
    let saved = null;
    const realCreate = w.URL.createObjectURL;
    w.URL.createObjectURL = (blob) => { saved = blob; return 'blob:test'; };
    const realClick = w.HTMLAnchorElement.prototype.click;
    let savedName = null;
    w.HTMLAnchorElement.prototype.click = function () { savedName = this.download; };
    saveBin.click();
    w.URL.createObjectURL = realCreate;
    w.HTMLAnchorElement.prototype.click = realClick;
    const savedBytes = saved ? new Uint8Array(await saved.arrayBuffer()) : null;
    check('save binary writes the original bytes', savedName === S.project.binary.name && savedBytes &&
        savedBytes.length === S.bytes.length && savedBytes.every((b, i) => b === S.bytes[i]), savedName);

    // 11. memory map and inspector render
    check('inspector shows label input', !!doc.getElementById('in-label'));
    check('problems badge', doc.getElementById('problem-count') !== null);
    const finalAsm = asm();

    // 12. relocation, using the example project when it is present
    const PROJ = 'test/out/galaxian-norel.xdis.json';   // staged by roundtrip.js
    if ((await fetch('../' + PROJ, { method: 'HEAD' })).ok) {
        frame.src = '../index.html?project=' + PROJ;
        await new Promise((r) => frame.onload = r);
        const w2 = frame.contentWindow, d2 = w2.document;
        w2.addEventListener('unhandledrejection', (e) => log('info', 'unhandled: ' + (e.reason && e.reason.stack || e.reason)));
        w2.addEventListener('error', (e) => log('info', 'error: ' + e.message));
        for (let i = 0; i < 200 && !(w2.xdis && w2.xdis.listing); i++) await sleep(50);
        const S2 = w2.xdis;
        const waitFor = async (cond) => { for (let i = 0; i < 300 && !cond(); i++) await sleep(10); return cond(); };
        const addDir2 = async (text) => {
            const inp = d2.getElementById('dir-add');
            inp.value = text;
            inp.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
            await sleep(30);
        };
        const ask2 = async (fn) => { for (let i = 0; i < 100 && !d2.getElementById('dlg').open; i++) await sleep(10); return fn(); };
        // a directive inside the block, to follow through relocation and back
        const inBlock = S2.project.directives.find((d) => d.type !== 'relocate' && d.addr >= 0x5600 && d.addr <= 0x75FF);
        const tracked = inBlock && w2.XDis.directiveString(inBlock);
        d2.querySelector('[data-tab=problems]').click();
        const sug = Array.from(d2.querySelectorAll('#problem-list .problem.suggest')).find((x) => /copied to/.test(x.textContent));
        check('relocation suggested in Problems', !!sug, sug && sug.textContent);
        sug.click();
        await ask2(() => {
            check('relocate dialog prefilled', d2.getElementById('rl-lo').value === '$5600' &&
                d2.getElementById('rl-hi').value === '$75FF' && d2.getElementById('rl-run').value === '$A000');
            d2.querySelector('#dlg button[value=ok]').click();
        });
        for (let i = 0; i < 300 && !S2.model.pieces.length; i++) await sleep(10);
        if (!S2.model.pieces.length) log('info', `reloc dir=${S2.project.directives.some((d) => d.type === 'relocate')} status="${d2.getElementById('status-msg').textContent}" open=${d2.getElementById('dlg').open} rv="${d2.getElementById('dlg').returnValue}" title="${d2.getElementById('dlg-title').textContent}" err="${(d2.getElementById('dlg-err') || {}).textContent}"`);
        check('relocated block created', S2.model.pieces.length === 1 && S2.model.pieces[0].start === 0xA000);
        const L2 = S2.listing.lines;
        check('org r: line in listing', L2.some((l) => l.k === 'dir' && /org r:\$A000/.test(l.p[0][1])));
        check('cursor moved to $A000', L2[S2.cur].a === 0xA000);
        check('directives moved to run addresses', inBlock && S2.project.directives.some((d) => d.type === inBlock.type &&
            d.addr === inBlock.addr - 0x5600 + 0xA000) && !S2.project.directives.some((d) => w2.XDis.directiveString(d) === tracked), tracked);
        check('jmp from loader names the run address', L2.some((l) => l.a === 0x5578 && l.p.some((p) => p[1] === 'lA000')));
        await sleep(60);
        check('inspector shows load address', /Loaded at/.test(d2.getElementById('tab-inspect').textContent) &&
            /\$5600/.test(d2.getElementById('tab-inspect').textContent));
        const gotoText = async (text) => {
            w2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'g' }));
            await ask2(() => {
                const inp = d2.getElementById('dlg-input');
                inp.value = text;
                inp.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
            });
            await waitFor(() => !d2.getElementById('dlg').open);
            return S2.listing.lines[S2.cur].a;
        };
        // $6344 is only loaded by segment 7, inside the relocated block
        check('goto a load address lands on the run address', await gotoText('$6344') === 0xAD44);
        check('goto seg:load address lands on the run address', await gotoText('7:$582E') === 0xA22E);
        check('map stripe for relocated block', S2.mapBaseFor === S2.listing && S2.model.pieces.length === 1);

        // pointer suggestion: #$BA / #$45 at $A392/$A396 form $BA45
        d2.querySelector('[data-tab=problems]').click();
        await sleep(20);
        const ps = Array.from(d2.querySelectorAll('#problem-list .problem.suggest')).find((x) => /form \$BA45/.test(x.textContent) && /\$A392/.test(x.textContent));
        check('pointer pair suggested', !!ps, ps && ps.textContent);
        check('apply-all button offered', !!d2.getElementById('btn-apply-ptrs'));
        check('suggestion badge', !d2.getElementById('suggest-count').hidden);
        if (ps) {
            ps.click();
            await ask2(() => {
                check('pointer dialog previews #>lBA45', /lda #>lBA45/.test(d2.getElementById('dlg-body').textContent));
                d2.querySelector('#dlg button[value=ok]').click();
            });
            await waitFor(() => S2.listing.lines.some((l) => l.a === 0xA392 && l.k === 'ins' && l.p.some((p) => p[1] === 'lBA45')));
            const l392 = S2.listing.lines.find((l) => l.a === 0xA392 && l.k === 'ins');
            const l396 = S2.listing.lines.find((l) => l.a === 0xA396 && l.k === 'ins');
            check('A392 shows #>lBA45', l392.p.map((p) => p[1]).join('').includes('#>lBA45'), l392.p.map((p) => p[1]).join(''));
            check('A396 shows #<lBA45', l396.p.map((p) => p[1]).join('').includes('#<lBA45'), l396.p.map((p) => p[1]).join(''));
            // dismissing a suggestion removes it and records a directive
            const firstSug = d2.querySelector('#problem-list .problem.suggest [data-dismiss]');
            const nSug = S2.model.warnings.filter((w) => w.suggest).length;
            firstSug.click();
            await waitFor(() => S2.model.warnings.filter((w) => w.suggest).length < nSug);
            check('dismiss removes the suggestion', S2.model.warnings.filter((w) => w.suggest).length === nSug - 1 &&
                S2.project.directives.some((d) => d.type === 'dismiss'));
            w2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'z', ctrlKey: true }));
            await waitFor(() => S2.model.warnings.filter((w) => w.suggest).length === nSug);
            check('undo brings it back', S2.model.warnings.filter((w) => w.suggest).length === nSug);
            const before = S2.model.warnings.filter((w) => w.suggest).length;
            d2.getElementById('btn-apply-ptrs').click();
            await waitFor(() => S2.model.warnings.filter((w) => w.suggest).length < before);
            check('apply all adds the rest', S2.model.warnings.filter((w) => w.suggest).length < before);
            w2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'z', ctrlKey: true }));
            await sleep(30);
        }
        // > on an immediate marks it as the high byte of an address
        await gotoText('5:$4800');
        check('cursor on lda #$43', S2.listing.lines[S2.cur].a === 0x4800);
        w2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: '>' }));
        await ask2(() => {
            const inp = d2.getElementById('dlg-input');
            check('> prefills the page address', inp && inp.value === '$4300', inp && inp.value);
            inp.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
        });
        const l4800 = () => S2.listing.lines.find((l) => l.s === 5 && l.a === 0x4800 && l.k === 'ins');
        await waitFor(() => /#>l4300/.test(l4800().p.map((p) => p[1]).join('')));
        check('> gives #>l4300', /#>l4300/.test(l4800().p.map((p) => p[1]).join('')));
        await addDir2('data pmdata=$4300');
        check('labeling the page gives #>pmdata', /#>pmdata/.test(l4800().p.map((p) => p[1]).join('')));
        check('pmdata equ emitted', /^pmdata equ \$4300/m.test(w2.XDis.asmText(S2.listing, S2.project.options)));
        await sleep(60);
        check('inspector lists the hi directive', /hi (5:)?\$4801/.test(d2.getElementById('tab-inspect').textContent));
        // an equate's Access: list covers its whole range, and links to each
        await addDir2('data dlist2=$3D00+50');
        const eq = S2.listing.lines.findIndex((l) => l.k === 'equ' && l.p[0][1] === 'dlist2');
        check('range equate lists all accesses', eq >= 0 && /A101 A104/.test(S2.listing.lines[eq].x), eq >= 0 && S2.listing.lines[eq].x);
        S2.cur = S2.anchor = Math.max(0, eq - 1);
        w2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'ArrowDown' }));   // redraws with the row in view
        await waitFor(() => d2.querySelector(`.row[data-i="${eq}"] [data-xk]`));
        check('range accesses are links', d2.querySelectorAll(`.row[data-i="${eq}"] [data-xk]`).length >= 10);
        // following dlist2+$3A from $B640 lands on the dlist2 equate
        await gotoText('$B640');
        check('cursor on sta dlist2+$3A', /dlist2\+\$3A/.test(S2.listing.lines[S2.cur].p.map((p) => p[1]).join('')));
        w2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'Enter' }));
        check('follow range offset goes to the equate', S2.listing.lines[S2.cur].k === 'equ' && S2.listing.lines[S2.cur].p[0][1] === 'dlist2',
            S2.listing.lines[S2.cur].k + ' ' + d2.getElementById('status-msg').textContent);
        check('status explains', /dlist2\+\$3A is not loaded — showing dlist2/.test(d2.getElementById('status-msg').textContent));
        w2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'z', ctrlKey: true }));
        await sleep(30);
        w2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'z', ctrlKey: true }));
        w2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'z', ctrlKey: true }));
        await sleep(30);

        // directive-made callers are links: -P goes to the earlier instruction
        await addDir2('codeptr $A393_A397');
        const li = S2.listing.lines.findIndex((l) => l.k === 'label' && l.a === 0xBA45);
        check('-P caller listed', li >= 0 && /-P A393_A397/.test(S2.listing.lines[li].x), li >= 0 && S2.listing.lines[li].x);
        S2.cur = S2.anchor = Math.max(0, li - 1);
        w2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'ArrowDown' }));
        await waitFor(() => d2.querySelector(`.row[data-i="${li}"] [data-xk]`));
        const pl = Array.from(d2.querySelectorAll(`.row[data-i="${li}"] .cm .xl`)).find((x) => x.textContent === '-P A393_A397');
        check('-P caller is a link', !!pl);
        if (pl) {
            pl.dispatchEvent(new w2.MouseEvent('mousedown', { bubbles: true, button: 0 }));
            check('-P goes to the earlier instruction', S2.listing.lines[S2.cur].a === 0xA392 && S2.listing.lines[S2.cur].k === 'ins',
                w2.XDis.h4(S2.listing.lines[S2.cur].a));
        }
        const ci = S2.listing.lines.findIndex((l) => l.k === 'label' && /-c [0-9A-F]{4}/.test(l.x || '') &&
            S2.project.directives.some((d) => d.type === 'code' && S2.model.mapDirective(d).addr === l.a));
        if (ci >= 0) {
            S2.cur = S2.anchor = Math.max(0, ci - 1);
            w2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'ArrowDown' }));
            await waitFor(() => d2.querySelector(`.row[data-i="${ci}"] [data-xdir]`));
            const cl = d2.querySelector(`.row[data-i="${ci}"] [data-xdir]`);
            cl.dispatchEvent(new w2.MouseEvent('mousedown', { bubbles: true, button: 0 }));
            check('-c shows the code directive', !d2.getElementById('tab-directives').hidden &&
                /^code /.test(d2.getElementById('dir-filter').value) && d2.querySelectorAll('#dir-list .item').length >= 1,
                d2.getElementById('dir-filter').value);
            d2.getElementById('dir-filter').value = '';
            d2.querySelector('[data-tab=inspect]').click();
        } else {
            log('skip', 'no -c caller with a project directive');
        }
        w2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'z', ctrlKey: true }));
        await sleep(30);

        // symbol set viewer
        d2.querySelector('[data-tab=directives]').click();
        const vb = d2.querySelector('[data-viewsym="sys.dop"]');
        check('symbol sets have a view button', !!vb);
        vb.click();
        await waitFor(() => d2.getElementById('dlg').open && d2.getElementById('sv-table'));
        check('viewer lists the labels', /sys\.dop — \d+ labels/.test(d2.getElementById('dlg-title').textContent) &&
            d2.querySelectorAll('#sv-table [data-symrow]').length === 291, d2.getElementById('dlg-title').textContent + ' / ' + d2.querySelectorAll('#sv-table [data-symrow]').length);
        check('viewer shows descriptions and headings', /DISPLAY LIST NMI VECTOR/.test(d2.getElementById('sv-table').textContent) &&
            d2.querySelectorAll('#sv-table tr.hd').length > 5);
        const svf = d2.getElementById('sv-filter');
        svf.value = 'cartcs';
        svf.dispatchEvent(new w2.Event('input'));
        check('viewer filter', d2.querySelectorAll('#sv-table [data-symrow]').length === 1);
        svf.value = '';
        svf.dispatchEvent(new w2.Event('input'));
        d2.getElementById('sv-used').click();
        const usedRows = d2.querySelectorAll('#sv-table [data-symrow]');
        check('only used here', usedRows.length > 0 && usedRows.length < 100 && Array.from(usedRows).every((r) => r.classList.contains('used') || r.classList.contains('off')), usedRows.length + ' used');
        // switch a used label off and on again
        const offRow = usedRows[0], offName = offRow.querySelectorAll('td')[1].textContent.replace('● ', '');
        offRow.querySelector('[data-symon]').click();
        await sleep(30);
        check('switching a label off removes it', !S2.listing.used.has(offName) && !S2.listing.defined.has(offName) &&
            (S2.project.includes.find((i) => i.name === 'sys.dop').off || []).includes(offName), offName);
        check('viewer shows it struck out', !!d2.querySelector(`#sv-table [data-symrow].off`));
        check('off count in the panel', /\(1 off\)/.test(d2.getElementById('symbol-sets').textContent));
        d2.querySelector(`#sv-table [data-symrow].off [data-symon]`).click();
        await sleep(30);
        check('and back on', S2.listing.used.has(offName) || S2.listing.defined.has(offName));
        // bulk: everything matching a filter
        d2.getElementById('sv-used').click();
        svf.value = '$e4';
        svf.dispatchEvent(new w2.Event('input'));
        const shown = d2.querySelectorAll('#sv-table [data-symrow]').length;
        d2.getElementById('sv-off').click();
        await sleep(30);
        check('disable shown', (S2.project.includes.find((i) => i.name === 'sys.dop').off || []).length === shown && shown > 10, shown + ' shown');
        d2.getElementById('sv-on').click();
        await sleep(30);
        check('enable shown re-enables them', !(S2.project.includes.find((i) => i.name === 'sys.dop').off || []).length);
        svf.value = '';
        svf.dispatchEvent(new w2.Event('input'));
        d2.getElementById('sv-used').click();
        const usedRows2 = d2.querySelectorAll('#sv-table [data-symrow].used');
        // clicks beside the checkbox or elsewhere in a row don't close the viewer
        const r0 = usedRows2[0], n0 = r0.querySelectorAll('td')[1].textContent.replace('● ', '');
        r0.querySelectorAll('td')[3].click();
        await sleep(20);
        check('clicking elsewhere in a row keeps the viewer open', d2.getElementById('dlg').open);
        d2.querySelector(`#sv-table [data-symrow="${r0.dataset.symrow}"] .cbcell`).click();
        await sleep(20);
        check('clicking beside the checkbox toggles it', d2.getElementById('dlg').open &&
            (S2.project.includes.find((i) => i.name === 'sys.dop').off || []).includes(n0));
        d2.querySelector(`#sv-table [data-symrow="${r0.dataset.symrow}"] .cbcell`).click();
        await sleep(20);
        check('and back', !(S2.project.includes.find((i) => i.name === 'sys.dop').off || []).includes(n0));
        const nameEl = d2.querySelector(`#sv-table [data-symrow="${r0.dataset.symrow}"] [data-symgo]`);
        const rowName = n0;
        nameEl.click();
        await sleep(30);
        check('clicking a row goes there', !d2.getElementById('dlg').open &&
            (S2.listing.lines[S2.cur].p[0] || [])[1] === rowName, rowName + ' / ' + (S2.listing.lines[S2.cur].p[0] || [])[1]);
        d2.querySelector('[data-tab=inspect]').click();

        // remove it again via R, from inside the block
        await gotoText('$A000');
        w2.dispatchEvent(new w2.KeyboardEvent('keydown', { key: 'r' }));
        await ask2(() => d2.querySelector('#dlg button[value=remove]').click());
        await waitFor(() => !S2.model.pieces.length);
        check('relocation removed', !S2.model.pieces.length && !S2.project.directives.some((d) => d.type === 'relocate'));
        check('directives moved back to load addresses', S2.project.directives.some((d) => w2.XDis.directiveString(d) === tracked), tracked);
    } else {
        log('skip', 'relocation: ' + PROJ + ' not found');
    }

    // 12b. banked cartridge: a raw XEGS 32 KB dump staged by roundtrip.js
    if ((await fetch('out/cart-raw-xegs.bin', { method: 'HEAD' })).ok) {
        frame.src = '../index.html?bin=test/out/cart-raw-xegs.bin&type=cart&cart=12';
        await new Promise((r) => frame.onload = r);
        const w4 = frame.contentWindow, d4 = w4.document;
        for (let i = 0; i < 100 && !(w4.xdis && w4.xdis.listing); i++) await sleep(50);
        const S4 = w4.xdis;
        check('cartridge loads as 4 banks', S4.img.banked && S4.img.segments.length === 4 && S4.img.cartName === 'XEGS 32 KB');
        d4.querySelector('[data-tab=project]').click();
        check('banks table with power-on mark', /Banks/.test(d4.getElementById('tab-project').textContent) &&
            /b3 ⏻/.test(d4.getElementById('tab-project').textContent));
        w4.dispatchEvent(new w4.KeyboardEvent('keydown', { key: 'g' }));
        for (let i = 0; i < 100 && !d4.getElementById('dlg').open; i++) await sleep(10);
        const gi = d4.getElementById('dlg-input');
        gi.value = 'b2:8000';
        gi.dispatchEvent(new w4.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
        await sleep(30);
        const gl = S4.listing.lines[S4.cur];
        check('goto b2:8000', gl.s === 3 && gl.a === 0x8000, gl.s + ':' + w4.XDis.h4(gl.a));
        check('bank prefix in address column', Array.from(d4.querySelectorAll('.row .ad .sg')).some((x) => x.textContent === 'b2:'));
        check('cart header traced from the boot bank', S4.listing.lines.some((l) => l.s === 4 && l.a === 0xA000 && l.k === 'ins'));
    } else {
        log('skip', 'cartridge: run roundtrip.js first');
    }

    // 12c. bank switching: an unknown bank is a problem you can resolve
    if ((await fetch('out/cart-xegs-switch.bin', { method: 'HEAD' })).ok) {
        frame.src = '../index.html?bin=test/out/cart-xegs-switch.bin&type=cart&cart=12';
        await new Promise((r) => frame.onload = r);
        const w5 = frame.contentWindow, d5 = w5.document;
        for (let i = 0; i < 100 && !(w5.xdis && w5.xdis.listing); i++) await sleep(50);
        const S5 = w5.xdis;
        const waitFor5 = async (cond) => { for (let i = 0; i < 300 && !cond(); i++) await sleep(10); return cond(); };
        const call = (a) => S5.listing.lines.find((l) => l.k === 'ins' && l.a === a).p.map((p) => p[1]).join('');
        check('known bank select resolves the call', /jsr b2_l8000/.test(call(0xA005)), call(0xA005));
        d5.querySelector('[data-tab=problems]').click();
        await sleep(30);
        const bp = Array.from(d5.querySelectorAll('#problem-list .problem')).find((x) => /bank is selected there is unknown/.test(x.textContent));
        check('unknown bank listed in Problems', !!bp && bp.classList.contains('link'));
        if (bp) {
            bp.click();
            await waitFor5(() => d5.getElementById('dlg').open);
            const bi = d5.getElementById('dlg-input');
            bi.value = '1';
            bi.dispatchEvent(new w5.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
            await waitFor5(() => /b1_l8000/.test(call(0xA00B)));
            check('choosing bank 1 resolves the call', /jsr b1_l8000/.test(call(0xA00B)), call(0xA00B));
            check('bank directive added', S5.project.directives.some((d) => d.type === 'bank' && d.bank === 1 && d.addr === 0xA00B));
            check('bank 1 code traced', S5.listing.lines.some((l) => l.s === 2 && l.a === 0x8000 && l.k === 'ins'));
            // the inspector names segments like the listing does (b3:, not 4:)
            const lb = S5.listing.lines.findIndex((l) => l.k === 'label' && l.s === 3 && l.a === 0x8000);
            S5.cur = S5.anchor = Math.max(0, lb - 1);
            w5.dispatchEvent(new w5.KeyboardEvent('keydown', { key: 'ArrowDown' }));
            d5.querySelector('[data-tab=inspect]').click();
            await sleep(60);
            const insp = d5.getElementById('tab-inspect').textContent;
            check('inspector callers use bank names', /b3:A005/.test(insp) && !/\b4:A005/.test(insp), (insp.match(/Callers[^A]*A005/) || [''])[0]);
        }
        // several directives pasted at once are one change
        d5.querySelector('[data-tab=directives]').click();
        const undoBefore = S5.undo.length;
        const dt = new w5.DataTransfer();
        dt.setData('text/plain', 'label one=$A000\nlabel two=$A005\n');
        d5.getElementById('dir-add').dispatchEvent(new w5.ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true }));
        await sleep(30);
        check('pasting two directives adds both', ['one', 'two'].every((n) => S5.project.directives.some((d) => d.name === n)));
        check('as one undo step', S5.undo.length === undoBefore + 1);
    } else {
        log('skip', 'bank switching: run roundtrip.js first');
    }

    // 13. self-modifying jmp in the bomb jack example: a low byte written
    // into the jmp operand
    const BJ = 'examples/bomb-jack-v1.5.xdis.json';
    if ((await fetch('../' + BJ, { method: 'HEAD' })).ok) {
        frame.src = '../index.html?project=' + BJ;
        await new Promise((r) => frame.onload = r);
        const w3 = frame.contentWindow, d3 = w3.document;
        for (let i = 0; i < 300 && !(w3.xdis && w3.xdis.listing); i++) await sleep(50);
        const S3 = w3.xdis;
        const waitFor3 = async (cond) => { for (let i = 0; i < 300 && !cond(); i++) await sleep(10); return cond(); };
        d3.querySelector('[data-tab=problems]').click();
        await sleep(30);
        const sp = Array.from(d3.querySelectorAll('#problem-list .problem.suggest')).find((x) => /at \$558D is the low byte of \$5595/.test(x.textContent));
        check('low byte write into jmp operand suggested', !!sp, sp && sp.textContent);
        if (sp) {
            sp.click();
            await waitFor3(() => d3.getElementById('dlg').open);
            check('dialog previews #<', /lda #<s3l5595/.test(d3.getElementById('dlg-body').textContent));
            d3.querySelector('#dlg button[value=ok]').click();
            const l558D = () => S3.listing.lines.find((l) => l.s === 3 && l.a === 0x558D && l.k === 'ins');
            await waitFor3(() => /#<s3l5595/.test(l558D().p.map((p) => p[1]).join('')));
            check('$558D shows #<s3l5595', /#<s3l5595/.test(l558D().p.map((p) => p[1]).join('')), l558D().p.map((p) => p[1]).join(''));
        }
    } else {
        log('skip', 'self-modifying jmp: ' + BJ + ' not found');
    }

    document.title = failures ? `FAIL ${failures}` : 'PASS';
    log(failures ? 'fail' : 'pass', `${failures} failure(s)`);
    // expose the final asm for inspection
    const pre = document.createElement('pre');
    pre.id = 'asm';
    pre.textContent = finalAsm.slice(0, 4000);
    document.body.appendChild(pre);
})().catch((e) => { failures++; log('fail', 'exception: ' + e.stack); document.title = 'FAIL'; });
</script>
